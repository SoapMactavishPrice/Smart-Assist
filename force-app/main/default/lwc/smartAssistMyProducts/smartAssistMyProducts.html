<template>
    <div class="sa-page">

        <!-- ===================== HEADER ===================== -->
        <div class="sa-header">
            <div class="sa-header-inner">
                <div class="sa-header-brand">
                    <span class="sa-header-icon" aria-hidden="true">
                        <lightning-icon icon-name="utility:apps" size="small" variant="inverse"></lightning-icon>
                    </span>
                    <div class="sa-header-text">
                        <h1 class="sa-header-title">My Products</h1>
                        <p class="sa-header-subtitle">SmartHome Pro</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="sa-body">

            <!-- ===================== ERROR BANNER ===================== -->
            <template if:true={hasError}>
                <div class="sa-card sa-error-banner" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="sa-error-icon"></lightning-icon>
                    <p class="sa-error-text">{errorMessage}</p>
                </div>
            </template>

            <!-- ===================== LOADING ===================== -->
            <template if:true={isLoading}>
                <div class="sa-card sa-loading-card">
                    <lightning-spinner alternative-text="Loading your products" size="small"></lightning-spinner>
                    <p class="sa-loading-text">Loading your products...</p>
                </div>
            </template>

            <!-- ===================== EMPTY STATE ===================== -->
            <template if:true={showEmptyState}>
                <div class="sa-card sa-empty-card">
                    <lightning-icon icon-name="utility:info" size="medium" class="sa-empty-icon"></lightning-icon>
                    <p class="sa-empty-title">No products yet</p>
                    <p class="sa-empty-text">We couldn't find any registered products on your account. If you believe this is an error, please contact support.</p>
                </div>
            </template>

            <!-- ===================== PRODUCT GRID ===================== -->
            <template if:true={showProductGrid}>
                <p class="sa-intro-text">Select a product to get AI-powered support.</p>
                <div class="sa-product-grid">
                    <template for:each={products} for:item="product">
                        <div key={product.assetId} class="sa-product-card" data-asset-id={product.assetId} onclick={handleSelectProduct}>
                            <div class="sa-product-card-header">
                                <span class="sa-product-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:product" size="small"></lightning-icon>
                                </span>
                                <span class={product.statusBadgeClass}>{product.status}</span>
                            </div>

                            <h2 class="sa-product-name">{product.productName}</h2>
                            <p class="sa-product-subname">{product.assetName}</p>

                            <div class="sa-product-details">
                                <div class="sa-product-detail-row">
                                    <span class="sa-field-label">Serial Number</span>
                                    <span class="sa-field-value">{product.serialNumber}</span>
                                </div>
                                <div class="sa-product-detail-row">
                                    <span class="sa-field-label">Purchase Date</span>
                                    <span class="sa-field-value">{product.purchaseDateFormatted}</span>
                                </div>
                                <template if:true={product.warrantyInfo}>
                                    <div class="sa-product-detail-row">
                                        <span class="sa-field-label">Warranty</span>
                                        <span class="sa-field-value">{product.warrantyInfo}</span>
                                    </div>
                                </template>
                            </div>

                            <div class="sa-product-card-footer">
                                <lightning-button
                                    variant="brand"
                                    label="Get Support"
                                    icon-name="utility:einstein"
                                    class="sa-support-button">
                                </lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

        </div>
    </div>
</template>
