<template>
    <section class="support-shell">
        <template if:true={hasError}>
            <div class="error-panel slds-m-bottom_medium" role="alert">
                <lightning-icon icon-name="utility:error" size="small" alternative-text="Error"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template if:true={showProducts}>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col">Asset Name</th>
                            <th scope="col">Serial Number</th>
                            <th scope="col">Status</th>
                            <th scope="col">Purchase Date</th>
                            <th scope="col">Warranty</th>
                            <th scope="col"><span class="slds-assistive-text">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={products} for:item="product">
                            <tr key={product.assetId}>
                                <th scope="row" data-label="Product">
                                    <div class="row-title">
                                        <lightning-icon icon-name="standard:product" size="x-small" alternative-text=""></lightning-icon>
                                        <span>{product.displayName}</span>
                                    </div>
                                </th>
                                <td data-label="Asset Name">{product.assetName}</td>
                                <td data-label="Serial Number">{product.serialNumber}</td>
                                <td data-label="Status">{product.status}</td>
                                <td data-label="Purchase Date">
                                    <lightning-formatted-date-time value={product.purchaseDate}></lightning-formatted-date-time>
                                </td>
                                <td data-label="Warranty">
                                    <lightning-badge label={product.warrantyStatus}></lightning-badge>
                                </td>
                                <td data-label="Actions" class="actions-cell">
                                    <lightning-button label="Get Support" variant="brand" data-id={product.assetId} onclick={handleGetSupport}></lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template if:true={isSupport}>
            <button class="back-button" type="button" onclick={handleBackToProducts}>
                <lightning-icon icon-name="utility:back" size="x-small" alternative-text=""></lightning-icon>
                <span>Back to My Products</span>
            </button>

            <div class="support-panel">
                <div class="support-heading">
                    <div>
                        <h1>SmartAssist 360 Support</h1>
                        <p>Product: <strong>{selectedProduct.displayName}</strong></p>
                        <p>Serial Number: <strong>{selectedProduct.serialNumber}</strong></p>
                    </div>
                    <lightning-icon icon-name="utility:einstein" size="large" alternative-text=""></lightning-icon>
                </div>

                <template if:true={showQuestionForm}>
                    <lightning-textarea
                        label="How can we help you?"
                        value={question}
                        placeholder="Describe the issue you're experiencing with this product..."
                        onchange={handleQuestionChange}
                        disabled={isProcessing}
                        class="question-box"
                    ></lightning-textarea>
                    <div class="actions">
                        <lightning-button label="Ask SmartAssist" variant="brand" onclick={handleAskSmartAssist} disabled={isProcessing}></lightning-button>
                    </div>
                </template>

                <template if:true={isProcessing}>
                    <div class="processing-state">
                        <lightning-spinner alternative-text="SmartAssist is analyzing" size="medium"></lightning-spinner>
                        <span>SmartAssist is analyzing your request...</span>
                    </div>
                </template>

                <template if:true={hasAiResult}>
                    <article class="ai-response">
                        <div class="response-header">
                            <h2>SmartAssist Recommendation</h2>
                            <div class="confidence">
                                <span>{confidenceLabel}</span>
                                <lightning-progress-ring value={analysis.confidenceScore} size="medium"></lightning-progress-ring>
                            </div>
                        </div>
                        <p class="response-text">{analysis.aiResponse}</p>
                        <dl class="analysis-grid">
                            <div>
                                <dt>Category</dt>
                                <dd>{analysis.category}</dd>
                            </div>
                            <div>
                                <dt>Subcategory</dt>
                                <dd>{analysis.subcategory}</dd>
                            </div>
                            <div>
                                <dt>Sentiment</dt>
                                <dd>{analysis.sentiment}</dd>
                            </div>
                            <div>
                                <dt>Summary</dt>
                                <dd>{analysis.summary}</dd>
                            </div>
                        </dl>
                        <div class="recommendation">
                            <h3>Recommended Next Step</h3>
                            <p>{analysis.recommendation}</p>
                        </div>
                    </article>
                </template>

                <template if:true={showSatisfactionQuestion}>
                    <div class="decision-panel">
                        <h2>Are you satisfied with the answer?</h2>
                        <div class="actions">
                            <lightning-button label="Yes, this solved my issue" variant="brand" onclick={handleResolved}></lightning-button>
                            <lightning-button label="No, I still need help" onclick={handleNeedHelp}></lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={showCreateCaseQuestion}>
                    <div class="decision-panel">
                        <h2>Would you like to create a support case?</h2>
                        <div class="actions">
                            <lightning-button label="Yes, Create Case" variant="brand" onclick={handleCreateCase}></lightning-button>
                            <lightning-button label="No, I'm done" onclick={handleResolved}></lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={showAutoCaseMessage}>
                    <div class="decision-panel">
                        <h2>Your request requires additional assistance.</h2>
                        <p>We're creating a support case for our support team.</p>
                    </div>
                </template>

                <template if:true={caseCreated}>
                    <div class="success-panel">
                        <lightning-icon icon-name="utility:success" size="small" alternative-text=""></lightning-icon>
                        <div>
                            <h2>Your support case has been created successfully.</h2>
                            <p>Case Number: {caseNumber}</p>
                        </div>
                    </div>
                </template>

                <template if:true={conversationResolved}>
                    <div class="success-panel">
                        <lightning-icon icon-name="utility:success" size="small" alternative-text=""></lightning-icon>
                        <h2>Great! We're glad we could help.</h2>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={showCases}>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Case Number</th>
                            <th scope="col">Subject</th>
                            <th scope="col">Priority</th>
                            <th scope="col">Status</th>
                            <th scope="col">Created Date</th>
                            <th scope="col">Product</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={cases} for:item="item">
                            <tr key={item.caseId}>
                                <th scope="row" data-label="Case Number">#{item.caseNumber}</th>
                                <td data-label="Subject">{item.subject}</td>
                                <td data-label="Priority">{item.priority}</td>
                                <td data-label="Status">
                                    <lightning-badge label={item.status}></lightning-badge>
                                </td>
                                <td data-label="Created Date">
                                    <lightning-formatted-date-time value={item.createdDate} year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                                </td>
                                <td data-label="Product">{item.productName}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </section>
</template>
